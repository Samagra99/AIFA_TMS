# Production Docker Compose — AIFA_TMS
# Usage: docker compose -f docker-compose.prod.yml up -d
# IMPORTANT: All secrets must be set via .env file. No defaults are provided.

version: "3.9"

services:
  backend:
    build: .
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      - db
      - redis
    restart: unless-stopped
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "4"]

  celery_worker:
    build: .
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: unless-stopped
    command: ["celery", "-A", "config.celery", "worker", "--loglevel=info"]

  celery_beat:
    build: .
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: unless-stopped
    command: ["celery", "-A", "config.celery", "beat", "--loglevel=info"]

  daphne:
    build: .
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    env_file:
      - .env
    expose:
      - "8001"
    depends_on:
      - db
      - redis
    restart: unless-stopped
    command: ["daphne", "-b", "0.0.0.0", "-p", "8001", "config.asgi:application"]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published ports — internal network only
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # No published ports — internal network only
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    # No published ports — internal network only
    command: server /data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./staticfiles:/var/www/static:ro
    depends_on:
      - backend
      - daphne
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
